name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token; this workflow never needs secrets or write access.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Regrade engine tests
        run: node --test tests/*.test.mjs
      - name: Data pipeline tests
        run: python3 -m unittest discover -s pipeline -v
      - name: Security lint
        run: python3 tests/check_security.py
